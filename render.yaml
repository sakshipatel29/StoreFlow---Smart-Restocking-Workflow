services:
  - type: web
    name: storeflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:4173","http://127.0.0.1:4173"]'
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "480"
      - key: DEMO_ADMIN_EMAIL
        value: admin@storeflow.demo
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ADMIN_NAME
        value: Northside Store Owner
