services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storeflow
      POSTGRES_USER: storeflow
      POSTGRES_PASSWORD: storeflow
    ports:
      - "5434:5432"
    volumes:
      - storeflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeflow -d storeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  storeflow_postgres_data:
